<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Carrinho | Cantinho do Topete</title>
</head>

<body>
    <header class="site-header sticky-top">
        <nav class="navbar navbar-expand-lg" aria-label="Navegação principal">
            <div class="container">
                <a class="navbar-brand" href="index.html#inicio">
                    <img src="imagem/logo_cantinho_do_topete.png" alt="Logo Cantinho do Topete" class="site-logo">
                </a>

                <a class="nav-cart ms-auto" href="carrinho.html" aria-label="Abrir carrinho">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count" class="cart-badge" hidden>0</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <h1 class="section-title mb-4">Meu carrinho</h1>

        <!-- carrinho vazio -->
        <div id="carrinho-vazio" class="text-center py-5" hidden>
            <p class="section-lead mb-4">Seu carrinho está vazio.</p>
            <a class="btn btn-topete" href="index.html#loja">Voltar para a loja</a>
        </div>

        <!-- pedido enviado -->
        <div id="pedido-sucesso" class="text-center py-5" hidden>
            <div class="alert alert-success">Pedido enviado! Em breve entraremos em contato.</div>
            <a class="btn btn-topete" href="index.html#loja">Voltar para a loja</a>
        </div>

        <!-- carrinho com itens -->
        <div id="carrinho-conteudo" hidden>
            <div id="carrinho-itens"></div>

            <div class="carrinho-total">
                <span>Total</span>
                <strong id="carrinho-total">R$ 0,00</strong>
            </div>

            <h2 class="h4 mt-5 mb-3">Finalizar pedido</h2>

            <form id="form-pedido" action="https://formsubmit.co/ajax/lara.vitoria14022@gmail.com" method="POST"
                novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome completo</label>
                        <input type="text" class="form-control" id="nome" name="nome" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="col-md-6">
                        <label for="telefone" class="form-label">Telefone / WhatsApp</label>
                        <input type="tel" class="form-control" id="telefone" name="telefone" required>
                    </div>
                    <div class="col-md-6">
                        <label for="cidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="cidade" name="cidade" required>
                    </div>
                    <div class="col-12">
                        <label for="observacao" class="form-label">Observações (opcional)</label>
                        <textarea class="form-control" id="observacao" name="observacao" rows="3"></textarea>
                    </div>

                    <!-- Configurações do FormSubmit -->
                    <input type="hidden" name="_subject" value="Novo pedido da loja - Cantinho do Topete">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_template" value="table">
                    <!-- Anti-spam: robôs preenchem, pessoas não veem -->
                    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

                    <div class="col-12">
                        <button type="submit" class="btn btn-topete">Enviar pedido</button>
                    </div>
                </div>
            </form>

            <div id="pedido-status" class="mt-3" role="status" aria-live="polite"></div>
        </div>
    </main>

    <footer id="contato"
        class="container py-4 border-top d-flex justify-content-between align-items-center flex-wrap gap-3">
        <p class="mb-0">&copy; 2026 Cantinho do Topete. Todos os direitos reservados.</p>
        <a class="btn btn-topete" href="#inicio">Voltar ao topo</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="produtos.js"></script>
    <script src="carrinho.js"></script>
</body>

</html>
